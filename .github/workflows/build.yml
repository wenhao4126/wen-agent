name: Build desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux amd64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Linux deps (Wails WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        run: |
          cd desktop
          wails build -ldflags "-X main.version=$(git describe --tags --always 2>/dev/null || echo dev)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenhao-linux-amd64
          path: desktop/build/bin/wenhao-desktop
          if-no-files-found: error

  build-windows:
    name: Windows amd64
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        run: |
          cd desktop
          wails build -ldflags "-X main.version=$(git describe --tags --always 2>/dev/null || echo dev)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenhao-windows-amd64
          path: desktop/build/bin/wenhao-desktop.exe
          if-no-files-found: error

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-13
          - arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        run: |
          cd desktop
          wails build -ldflags "-X main.version=$(git describe --tags --always 2>/dev/null || echo dev)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenhao-macos-${{ matrix.arch }}
          path: desktop/build/bin/wenhao-desktop
          if-no-files-found: error

  release:
    name: Create release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename and flatten assets
        run: |
          mkdir -p release-assets
          # Linux
          cp artifacts/wenhao-linux-amd64/wenhao-desktop release-assets/wenhao-linux-amd64 2>/dev/null || true
          # Windows
          cp artifacts/wenhao-windows-amd64/wenhao-desktop.exe release-assets/wenhao-windows-amd64.exe 2>/dev/null || true
          # macOS
          cp artifacts/wenhao-macos-amd64/wenhao-desktop release-assets/wenhao-macos-amd64 2>/dev/null || true
          cp artifacts/wenhao-macos-arm64/wenhao-desktop release-assets/wenhao-macos-arm64 2>/dev/null || true
          cd release-assets && ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
